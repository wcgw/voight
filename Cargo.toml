[package]
name = "voight"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Estimates how much of a text was written by an LLM, with a DeBERTa or ModernBERT classifier fine-tuned on human vs LLM-written text"
repository = "https://github.com/wcgw/voight"
readme = "README.md"
keywords = ["llm", "ai-detection", "ai-generated-text", "classifier", "cli"]
categories = ["command-line-utilities", "text-processing", "artificial-intelligence"]

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4.6.7", features = ["derive"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
indicatif = { version = "0.17", optional = true }
serde_json = "1.0.154"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
unicode-normalization = { version = "0.1.25", default-features = false }

# candle's wgpu backend is unreleased (huggingface/candle#3379); the `wgpu`
# feature runs on the fork it lives in instead of the candle crates above.
candle-core-wgpu = { package = "candle-core", git = "https://github.com/KimHenrikOtte/candle", rev = "25e83d57cad096fd5f8f1c5d57ba4813597f98cb", features = ["wgpu"], optional = true }
candle-nn-wgpu = { package = "candle-nn", git = "https://github.com/KimHenrikOtte/candle", rev = "25e83d57cad096fd5f8f1c5d57ba4813597f98cb", features = ["wgpu"], optional = true }
candle-transformers-wgpu = { package = "candle-transformers", git = "https://github.com/KimHenrikOtte/candle", rev = "25e83d57cad096fd5f8f1c5d57ba4813597f98cb", features = ["wgpu"], optional = true }

# On Apple silicon the detector runs on the GPU through Metal by default.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[[bin]]
name = "voight"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
# The `voight` command; turn it off to embed the library without clap.
cli = ["dep:clap", "dep:indicatif"]
# Run the detector on an NVIDIA GPU when one is available (needs the CUDA toolkit to build).
cuda = [
    "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda",
    "candle-core-wgpu?/cuda", "candle-nn-wgpu?/cuda", "candle-transformers-wgpu?/cuda",
]
# Metal on other Macs; already on for Apple silicon.
metal = [
    "candle-core/metal", "candle-nn/metal", "candle-transformers/metal",
    "candle-core-wgpu?/metal", "candle-nn-wgpu?/metal", "candle-transformers-wgpu?/metal",
]
# Any other GPU (Intel, AMD; through Vulkan on Linux) when CUDA and Metal aren't
# compiled in. Experimental: builds on a fork of candle.
wgpu = ["dep:candle-core-wgpu", "dep:candle-nn-wgpu", "dep:candle-transformers-wgpu"]
