[package]
name = "voight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
indicatif = "0.17"
serde_json = "1.0.154"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# On Apple silicon the detector runs on the GPU through Metal by default.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[features]
# Run the detector on an NVIDIA GPU when one is available (needs the CUDA toolkit to build).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Metal on other Macs; already on for Apple silicon.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
